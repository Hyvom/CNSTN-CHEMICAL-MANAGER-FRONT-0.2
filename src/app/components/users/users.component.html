<div class="users-container">
  <h2>Users Management</h2>

  <p>{{ message }}</p>

  <table border="1" width="100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button (click)="deleteUser(user.id)">🗑️ Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
